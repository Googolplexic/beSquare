<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Get started with Add-on development using JavaScript with Document Sandbox Runtime" />
    <meta name="keywords" content="Adobe, Express, Add-On, JavaScript, Document Sandbox Runtime" />
    <meta name="permissions-policy" content="microphone=('*')">
    <meta http-equiv="Permissions-Policy" content="microphone=('*')">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doug</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fff 0%, #A4A67C20 100%);
            margin: 0;
            min-height: 100vh;
        }

        .container {
            margin: 24px auto;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #0F2624;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            background: #0D7339;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: 600;
            transform: rotate(-5deg);
            box-shadow: 0 4px 12px rgba(13, 115, 57, 0.2);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: rotate(5deg);
        }

        button {
            background-color: rgba(13, 115, 57, 0.7);
            border: none;
            border-radius: 8px;
            color: white;
            height: 40px;
            width: 80%;
            margin: 8px 0;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(13, 115, 57, 0.2);
        }

        button:not([disabled]):hover {
            background-color: rgba(15, 38, 36, 0.8);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 38, 36, 0.3);
        }

        button:disabled {
            background-color: #A4A67C;
            color: #fff;
            opacity: 0.5;
            box-shadow: none;
        }

        .button-container {
            display: flex;
            gap: 12px;
            margin: 8px 0;
            width: 80%;
        }

        .button-container button {
            width: 50%;
        }

        #userInput, #readOnly {
            width: 80%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #A4A67C;
            font-family: inherit;
            font-size: 15px;
            margin: 8px 0;
            resize: vertical;
            transition: border-color 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            color: #0F2624;
        }

        #userInput:focus, #readOnly:focus {
            outline: none;
            border-color: #0D7339;
        }

        #initThread {
            width: 40%;
            height: 32px;
            font-size: 13px;
            background-color: rgba(217, 70, 37, 0.7);
            border-radius: 16px;
        }

        #initThread:hover {
            background-color: rgba(217, 70, 37, 0.9);
        }

        #request-mic {
            background-color: rgba(13, 115, 57, 0.8);
            background-image: none;
            transition: all 0.3s ease;
        }

        #request-mic:not([disabled]):hover {
            background-color: rgba(13, 115, 57, 0.9);
        }

        #request-mic[isOn="true"] {
            background-color: rgba(217, 70, 37, 0.9);
            animation: pulse 2s infinite;
        }

        #request-mic[isOn="true"]:hover {
            background-color: rgba(217, 70, 37, 1);
        }

        #discardCommand {
            background-color: rgba(242, 118, 107, 0.7);
            background-image: none;
        }

        #discardCommand:not([disabled]):hover {
            background-color: rgba(242, 118, 107, 0.9);
        }

        #sendButton {
            background-color: rgba(126, 145, 98, 0.7);
        }

        #sendButton:not([disabled]):hover {
            background-color: rgba(164, 166, 124, 0.9);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .loading-dots {
            display: none;
            font-size: 24px;
            color: #0D7339;
            text-align: center;
            margin: 8px 0;
        }

        .loading-dots.active {
            display: block;
            animation: dotty steps(1,end) 1s infinite;
        }

        @keyframes dotty {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        #sendButton.loading {
            position: relative;
            color: transparent;
        }

        #sendButton.loading::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #readOnly {
            min-height: 60px;
            max-height: 120px;
            transition: all 0.3s ease;
            position: relative;
        }

        #readOnly::after {
            content: attr(data-status);
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 12px;
            color: #666;
            opacity: 0.8;
        }

    </style>
</head>

<body>
    <!-- 
            Please note that this document does not use the spectrum web components theme for Express.
            You may use "addOnUISdk.app.ui.theme" to get the current theme and style accordingly.
        -->
    <div class="container">
        <div class="logo">D</div>
        <button id="initThread">Reset Context</button>
        <button id="request-mic" isOn=false disabled>Start Voice Command</button>

        <textarea id="userInput" placeholder="Your command will be displayed here"></textarea>

        <div class="button-container">
            <button id="discardCommand">Clear</button>
            <button id="sendButton">Send</button>
        </div>

        <div class="loading-dots">Thinking</div>
        <textarea id="readOnly" placeholder="Response will appear here..." readonly data-status=""></textarea>
    </div>

    <script type="module" src="ui/index.js"></script>
</body>

</html>
